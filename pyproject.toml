[project]
name = "cryptostream-realtime"
version = "0.1.0"
description = "Real-time crypto market data pipeline: Binance WebSocket → Kafka → Spark Structured Streaming → Delta Lake on S3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Mauricio Behrens", email = "mauricio.esquivel1806@gmail.com" }]
keywords = ["data-engineering", "streaming", "kafka", "spark", "delta-lake", "crypto"]

dependencies = [
    "websockets>=13.0,<14.0",
    "confluent-kafka>=2.5.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "structlog>=24.4,<25.0",
    "typer>=0.12,<1.0",
    "rich>=13.8,<14.0",
    "boto3>=1.35,<2.0",
    "tenacity>=9.0,<10.0",
    "orjson>=3.10,<4.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.2,<4.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "testcontainers[kafka]>=4.8,<5.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
    "pre-commit>=3.8,<4.0",
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.1,<2.0",
]
airflow = [
    "apache-airflow>=2.9,<3.0",
    "apache-airflow-providers-amazon>=8.0,<9.0",
]

[project.scripts]
cryptostream-producer = "src.producer.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "cryptostream-realtime[dev,spark]",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "pyspark.*",
    "delta.*",
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
]
addopts = "-v --tb=short --strict-markers"
